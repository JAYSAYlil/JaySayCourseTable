name: Android CI

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      full_legacy_matrix:
        description: "同时运行 API 26/29 UI 测试"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "20 18 * * 6"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: JVM tests, Lint and Debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run quality checks
        run: ./gradlew --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

  ui-api34:
    name: UI tests (API 34)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run API 34 instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --stacktrace :app:connectedDebugAndroidTest

  ui-legacy:
    name: UI tests (API ${{ matrix.api-level }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_legacy_matrix)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run legacy instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --stacktrace :app:connectedDebugAndroidTest
