name: Android CI

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      full_legacy_matrix:
        description: "同时运行 API 26/29 UI 测试"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "20 18 * * 6"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: JVM tests, Lint, Debug and Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Docs version sync check
        # 发版时文档必须与 build.gradle.kts 同步（README/维护文档/开发状态/CHANGELOG），
        # 缺一不可，防止公开仓库的版本信息与实际安装包脱节。
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "checking docs for $VERSION (versionCode $CODE)"
          grep -q "当前版本：\`$VERSION\`（versionCode $CODE）" README.md             || { echo "README.md 当前版本行与 build.gradle.kts 不一致"; exit 1; }
          grep -q "当前版本：$VERSION，versionCode $CODE" docs/MAINTENANCE.md             || { echo "docs/MAINTENANCE.md 版本不一致"; exit 1; }
          grep -q "当前版本：$VERSION / versionCode $CODE" docs/DEVELOPMENT_STATUS.md             || { echo "docs/DEVELOPMENT_STATUS.md 版本不一致"; exit 1; }
          head -60 CHANGELOG.md | grep -q "## v$VERSION"             || { echo "CHANGELOG.md 顶部缺少 $VERSION 条目"; exit 1; }
      - name: Run quality checks
        # assembleRelease 守护 POI 反射 keep 规则与 R8 配置不被后续改动破坏
        run: ./gradlew --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease

  ui-api34:
    name: UI tests (API 34)
    # 仅在 PR / 手动 / 每周计划时运行：GitHub Actions 的模拟器为软件渲染，
    # push 触发时偶发超时会把 main 标红；本地模拟器已全量验证。
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    # ubuntu-22.04 runners provide KVM for hardware-accelerated emulator boots;
    # the newer hosted-compute ubuntu-latest image exposes no /dev/kvm access.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run API 34 instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          boot-timeout: 600000
          emulator-options: -no-snapshot -no-audio -gpu swiftshader_indirect
          script: ./gradlew --stacktrace :app:connectedDebugAndroidTest

  ui-legacy:
    name: UI tests (API ${{ matrix.api-level }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_legacy_matrix)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run legacy instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --stacktrace :app:connectedDebugAndroidTest